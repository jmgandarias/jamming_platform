force_displacement_experiment:
  ros__parameters:
    loop_rate: 100.0

    port_name: "/dev/ttyUSB0"
    protocol_version: 2.0
    baudrate: 57600
    motor_id: 1

    initial_position_deg: 180.0
    position_tolerance_deg: 2.0
    max_displacement_deg: 90.0
    goal_velocity_rpm: -10.0
    max_force_n: 40.0

    pressure_start_kpa: 0.0
    pressure_end_kpa: -80.0
    pressure_step_kpa: -10.0
    pressure_tolerance_kpa: 2.0
    repetitions_per_pressure: 10

    settle_time_s: 2.0
    pressure_settle_timeout_s: 5.0
    move_timeout_s: 20.0
